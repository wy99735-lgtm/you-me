<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marriage Certificate</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Patrick+Hand&family=Rubik:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
:root{--page:#f3e3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1c1218}}
:root[data-theme="dark"]{--page:#1c1218}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);display:grid;place-items:center;overflow:hidden}
#stage{position:relative;overflow:hidden;aspect-ratio:9/16;width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .5625));container-type:inline-size;background:#fbc3cf;border-radius:2cqw;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;cursor:pointer}
.bg{position:absolute;inset:0}
.b1{background:linear-gradient(180deg,#fbd5db 0%,#f9bcc7 100%)}
.b2{background:linear-gradient(180deg,#f4dcec 0%,#f3bde0 100%);opacity:0}
#stage>*{position:absolute}
#cert,#mine,#take,#fp,#cat{opacity:0}
#hint{left:0;width:100%;top:77cqw;text-align:center;font:700 5.7cqw/1.25 "Courier Prime","Courier New",monospace;color:#ff0a78;letter-spacing:-.1cqw}
#oval{left:36.5cqw;top:107cqw;width:27cqw;height:32.4cqw}
#oval svg{width:100%;height:100%;overflow:visible}
#fp{left:50%;top:122.7cqw;width:24cqw;height:28.8cqw;will-change:transform,opacity}
#fp svg{width:100%;height:100%}
#ripple{left:50%;top:122.7cqw;width:30cqw;height:30cqw;margin:-15cqw 0 0 -15cqw;border:.8cqw solid #ff4f9a;border-radius:50%;opacity:0}
#cert{left:20.5cqw;top:19cqw;width:57cqw;height:76cqw;will-change:transform,opacity}
#cert svg{width:100%;height:100%;overflow:visible}
.txt{left:0;width:100%;text-align:center;font:italic 900 8.2cqw/1.1 Rubik,Arial Black,sans-serif;color:#ff1a7a;-webkit-text-stroke:1.1cqw #a3004c;paint-order:stroke fill;text-shadow:0 .6cqw 0 #7a0035,0 0 1.4cqw rgba(255,255,255,.7)}
#mine{top:96cqw}
#take{top:113cqw;font-size:6.6cqw;-webkit-text-stroke-width:.9cqw}
#cat{left:-1cqw;top:95.4cqw;width:112cqw;height:117.6cqw;transform-origin:50% 40.5%;will-change:transform}
#cat svg{width:100%;height:100%;overflow:visible}
#hearts{inset:0;pointer-events:none}
.h{position:absolute;color:#ff6fa8;line-height:1;pointer-events:none}
#replay{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));opacity:0;pointer-events:none;border:0;border-radius:99px;padding:10px 18px;font:600 15px system-ui,sans-serif;background:#ff1a7a;color:#fff;cursor:pointer;z-index:5}
#replay:focus-visible{outline:3px solid #fff;outline-offset:2px}
#oval,#mine,#take,#hint{will-change:transform,opacity}
</style>
</head>
<body>
<div id="stage" aria-label="Animated marriage certificate with a cat holding a flower">
  <div class="bg b1"></div><div class="bg b2" id="b2"></div>
  <div id="hearts"></div>
  <div id="hint">Put your finger<br>here to sign</div>
  <div id="oval"><svg viewBox="0 0 100 120"><ellipse cx="50" cy="60" rx="44" ry="54" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 9"/></svg></div>
  <div id="ripple"></div>
  <div id="fp"><svg viewBox="0 0 100 120" id="fpsvg"></svg></div>
  <div id="cert"><svg viewBox="0 0 300 400" id="certsvg"></svg></div>
  <div id="mine" class="txt">You are mine now</div>
  <div id="take" class="txt">Take this ❤️</div>
  <div id="cat"><svg viewBox="0 0 400 420" id="catsvg"></svg></div>
  <button id="replay" type="button">Replay</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const K='#1b1b1b';

function fpInner(c){
  let s='';
  for(let i=0;i<9;i++){
    const rx=6+i*5.4, ry=8+i*6.4;
    s+=`<ellipse cx="50" cy="60" rx="${rx}" ry="${ry}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${40+i*7} ${5+(i%3)*3} ${14+i*2} ${4+(i%2)*4}" stroke-dashoffset="${i*13}" transform="rotate(${-14+i*1.5} 50 60)"/>`;
  }
  return s+`<circle cx="50" cy="60" r="2.5" fill="${c}"/>`;
}
$('#fpsvg').innerHTML=fpInner(K);

$('#certsvg').innerHTML=`
<defs><g id="cn"><path d="M10 10h34v9q-18 3-25 25h-9z" fill="#fff" stroke="${K}" stroke-width="5" stroke-linejoin="round"/></g></defs>
<path d="M14 12 L286 9 Q292 10 291 18 L288 380 Q287 390 278 391 L20 392 Q10 392 11 382 Z" transform="translate(4 9)" fill="#c2487f" opacity=".22"/>
<path d="M14 12 L286 9 Q292 10 291 18 L288 380 Q287 390 278 391 L20 392 Q10 392 11 382 Z" fill="#fff" stroke="${K}" stroke-width="5" stroke-linejoin="round"/>
<use href="#cn"/><use href="#cn" transform="translate(300 0) scale(-1 1)"/><use href="#cn" transform="translate(0 400) scale(1 -1)"/><use href="#cn" transform="translate(300 400) scale(-1 -1)"/>
<rect x="26" y="26" width="248" height="348" rx="14" fill="none" stroke="#f08ab0" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M150 68C128 53 133 36 146 39c4 1 4 5 4 5s0-4 4-5c13-3 18 14-4 29z" fill="#e8334a" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>
<g font-family="'Patrick Hand','Comic Sans MS',cursive" fill="${K}" text-anchor="middle">
<text x="150" y="110" font-size="38" letter-spacing="1.5">MARRIAGE</text>
<text x="150" y="140" font-size="29" letter-spacing="1">CERTIFICATE</text>
<text x="150" y="208" font-size="35">ME + YOU</text>
<text x="90" y="354" font-size="20">ME</text><text x="214" y="354" font-size="20">YOU</text></g>
<g stroke="#f08ab0" stroke-width="2.5" stroke-linecap="round"><path d="M96 162h40M164 162h40M92 220h116"/></g>
<path d="M150 168c-6-4-5-9-1-9 2 0 1 2 1 2s-1-2 1-2c4 0 5 5-1 9zM150 238c-6-4-5-9-1-9 2 0 1 2 1 2s-1-2 1-2c4 0 5 5-1 9z" fill="#f08ab0"/>
<g transform="translate(60 246) scale(.6)">${fpInner('#e8708f')}</g>
<g id="youfp"><g transform="translate(184 246) scale(.6)">${fpInner(K)}</g></g>
<g stroke="${K}" stroke-width="3" stroke-linecap="round"><path d="M62 330h56M186 330h56"/></g>
<path d="M150 380c-5-3-4-7-1-7 2 0 1 1 1 1s-1-1 1-1c3 0 4 4-1 7z" fill="#f08ab0"/>`;

$('#catsvg').innerHTML=`
<g stroke="${K}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
 <path d="M85 112Q72 42 100 24Q142 38 162 78Z" fill="#fff"/><path d="M104 96Q99 58 109 48Q131 58 141 82Z" fill="#ffb8c8" stroke="none"/>
 <path d="M315 112Q328 42 300 24Q258 38 238 78Z" fill="#fff"/><path d="M296 96Q301 58 291 48Q269 58 259 82Z" fill="#ffb8c8" stroke="none"/>
 <ellipse cx="200" cy="365" rx="120" ry="118" fill="#fff"/>
 <g id="head">
  <ellipse cx="200" cy="170" rx="138" ry="106" fill="#fff"/>
  <g stroke="none"><ellipse cx="106" cy="206" rx="21" ry="12" fill="#ffadc0" opacity=".85"/><ellipse cx="294" cy="206" rx="21" ry="12" fill="#ffadc0" opacity=".85"/></g>
  <g stroke-width="2.5" fill="none"><path d="M72 198l-36-8M72 212l-38 4M80 225l-30 12M328 198l36-8M328 212l38 4M320 225l30 12"/></g>
  <g stroke="none"><ellipse id="eyeL" cx="150" cy="178" rx="22" ry="26" fill="#111"/><ellipse id="eyeR" cx="250" cy="178" rx="22" ry="26" fill="#111"/>
  <circle cx="143" cy="168" r="8" fill="#fff"/><circle cx="158" cy="190" r="4" fill="#fff"/><circle cx="243" cy="168" r="8" fill="#fff"/><circle cx="258" cy="190" r="4" fill="#fff"/></g>
  <path d="M192 203Q200 198 208 203Q205 213 200 214Q195 213 192 203Z" fill="#ff8fab" stroke-width="2.5"/>
  <path d="M200 214Q200 226 187 226M200 214Q200 226 213 226" fill="none" stroke-width="3"/>
 </g>
 <path d="M96 268Q200 306 304 268" fill="none" stroke-width="22"/><path d="M96 268Q200 306 304 268" fill="none" stroke="#4cb040" stroke-width="13"/>
 <g transform="translate(200 322)"><circle cx="-8" cy="-8" r="10" fill="#3fa23a" stroke-width="2.5"/><circle cx="8" cy="-8" r="10" fill="#3fa23a" stroke-width="2.5"/><circle cx="-8" cy="8" r="10" fill="#3fa23a" stroke-width="2.5"/><circle cx="8" cy="8" r="10" fill="#3fa23a" stroke-width="2.5"/></g>
 <g id="clasp"><ellipse cx="183" cy="326" rx="17" ry="22" fill="#fff"/><ellipse cx="217" cy="326" rx="17" ry="22" fill="#fff"/></g>
 <ellipse cx="335" cy="372" rx="24" ry="34" fill="#fff" transform="rotate(-14 335 372)"/>
 <g id="flowerArm">
  <path d="M96 372Q82 330 76 262" fill="none" stroke="#3fa23a" stroke-width="7"/>
  <path d="M84 318q-24-10-30-2 12 14 30 2z" fill="#4cb040" stroke-width="3"/>
  <g transform="translate(74 238)"><g fill="#fff" stroke-width="3.5"><circle cx="0" cy="-28" r="17"/><circle cx="27" cy="-9" r="17"/><circle cx="17" cy="23" r="17"/><circle cx="-17" cy="23" r="17"/><circle cx="-27" cy="-9" r="17"/></g><circle r="15" fill="#ffd23f" stroke-width="3.5"/></g>
  <ellipse cx="102" cy="368" rx="26" ry="38" fill="#fff" transform="rotate(-10 102 368)"/>
 </g>
</g>`;

const stage=$('#stage'), cqw=()=>stage.clientWidth/100;
let hid, nudge, tl, state='idle';

function buzz(){try{navigator.vibrate&&navigator.vibrate([45,35,90])}catch(e){}}

function burst(){
  const W=cqw(), cx=(20.5+57*.7)*W, cy=(19+76*.7)*W;
  for(let i=0;i<12;i++){
    const h=document.createElement('span');
    h.className='h';h.textContent='♥';
    h.style.cssText=`left:${cx}px;top:${cy}px;font-size:${(2+Math.random()*3)*W/10}px`;
    $('#hearts').appendChild(h);
    const a=Math.random()*Math.PI*2, d=(8+Math.random()*16)*W/10;
    gsap.fromTo(h,{scale:0,opacity:1},{x:Math.cos(a)*d*2,y:Math.sin(a)*d*2-W*.8,rotation:(Math.random()-.5)*80,scale:1,opacity:0,duration:1.4+Math.random()*.6,ease:'power2.out',onComplete:()=>h.remove()});
  }
}
function floatHeart(){
  const W=cqw(),h=document.createElement('span');
  h.className='h';h.textContent='♥';
  h.style.cssText=`left:${Math.random()*100}%;top:100%;font-size:${(2+Math.random()*3.5)*W/10}px;opacity:.5`;
  $('#hearts').appendChild(h);
  gsap.to(h,{y:-stage.clientHeight*(.5+Math.random()*.5),x:(Math.random()-.5)*W*.2,opacity:0,rotation:(Math.random()-.5)*50,duration:4+Math.random()*2.5,ease:'sine.out',onComplete:()=>h.remove()});
}
function popYou(){
  gsap.set('#youfp',{opacity:1});
  gsap.fromTo('#youfp',{scale:1.15,svgOrigin:'214 282'},{scale:1,duration:.4,ease:'back.out(3)'});
  burst();
}

function build(){
  gsap.globalTimeline.clear(); clearInterval(hid);
  $('#hearts').innerHTML='';
  gsap.set('#stage',{clearProps:'all'});
  gsap.set('#stage *',{clearProps:'all'});
  gsap.set('#youfp',{opacity:0});
  gsap.set('#flowerArm',{opacity:0});
  gsap.set('#cat',{opacity:1,xPercent:-8,yPercent:53,scale:.657});
  nudge=gsap.to('#oval',{scale:1.07,repeat:-1,yoyo:true,duration:.6,ease:'sine.inOut'});

  tl=gsap.timeline({paused:true});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) tl.timeScale(4);

  tl.to('#hint',{opacity:0,duration:.2},0)
    .to('#oval',{opacity:0,scale:1.15,duration:.3},0)
    .fromTo('#ripple',{opacity:.7,scale:.4},{opacity:0,scale:2.2,duration:.7,ease:'power2.out'},0)
    .fromTo('#fp',{opacity:0,scale:1.5,xPercent:-50,yPercent:-50},{opacity:1,scale:1,duration:.22,ease:'back.out(2)'},0)
    .to('#stage',{keyframes:{x:[-3,3,-2,2,-1,0],y:[2,-2,1,-1,0,0]},duration:.3,ease:'none'},0)
    .to('#fp',{y:()=>-10.7*cqw(),duration:.4,ease:'sine.out'},.5)
    .to('#fp',{y:()=>15.3*cqw(),scale:.5,duration:1.2,ease:'power2.inOut'},.9)
    .to('#b2',{opacity:1,duration:1,ease:'none'},1.6)
    .fromTo('#cert',{opacity:0,scale:1.18,rotation:5},{opacity:1,scale:1,rotation:-1.5,duration:1.1,ease:'power3.out'},2.2)
    .to('#fp',{x:()=>(61.2-50)*cqw(),y:()=>(72.6-122.7)*cqw(),scale:.475,rotation:-6,duration:.9,ease:'power2.inOut'},3.2)
    .to('#fp',{opacity:0,duration:.15},4.05)
    .call(popYou,null,4.05)
    .call(()=>{hid=setInterval(floatHeart,900)},null,4.6)
    .fromTo('#mine',{opacity:0,y:20,scale:.6},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(2.5)'},5)
    .to('#cat',{yPercent:0,duration:1.7,ease:'back.out(1.3)'},5.4)
    .to('#cat',{rotation:2,duration:1.7,yoyo:true,repeat:1,ease:'sine.inOut'},7.2)
    .to('#clasp',{opacity:0,y:40,duration:.3},9.6)
    .to('#cat',{xPercent:0,scale:1,duration:.7,ease:'back.out(1.3)'},9.6)
    .fromTo('#flowerArm',{opacity:0,y:170,rotation:-18,svgOrigin:'100 380'},{opacity:1,y:0,rotation:0,duration:.7,ease:'back.out(1.6)'},9.7)
    .fromTo('#take',{opacity:0,y:20,scale:.6},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(2.5)'},9.9)
    .to('#replay',{opacity:1,pointerEvents:'auto',duration:.4},12.2);

  ['#eyeL','#eyeR'].forEach(e=>gsap.to(e,{scaleY:.08,svgOrigin:e==='#eyeL'?'150 178':'250 178',duration:.09,yoyo:true,repeat:-1,repeatDelay:2.6,delay:8}));
  state='idle';
}

function start(){
  if(state!=='idle') return;
  state='play';
  const active=navigator.userActivation?navigator.userActivation.hasBeenActive:true;
  buzz();
  if(!active) stage.addEventListener('pointerup',buzz,{once:true});
  nudge.kill();
  tl.play(0);
}
stage.addEventListener('pointerdown',start,{passive:true});
$('#replay').addEventListener('pointerdown',e=>e.stopPropagation());
$('#replay').addEventListener('click',build);
build();
</script>
</body>
</html>
